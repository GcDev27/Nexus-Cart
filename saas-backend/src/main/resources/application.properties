# ═══════════════════════════════════════════════
# NexusCart SaaS — Backend Configuration
# ═══════════════════════════════════════════════

# Desenvolvimento: chaves locais (Asaas, SMTP...) num arquivo saas-backend/.env, fora do git.
# Formato: NOME=valor, uma por linha. Variáveis de ambiente de verdade têm prioridade.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]

# ─── Database ───
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/saas_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
# O esquema do banco é criado e alterado só pelas migrations do Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.flyway.enabled=true
# Banco que já existia antes do Flyway: marca a V1 como aplicada em vez de tentar recriar as tabelas
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Log das queries só quando pedido (deixa o log de produção legível)
spring.jpa.show-sql=${SHOW_SQL:false}

# ─── Server ───
server.port=${SERVER_PORT:8081}
# Atrás de proxy (Nginx/Caddy), usa o IP real do X-Forwarded-For, mas só quando a conexão
# vem de um proxy da rede interna: quem acessa direto não consegue forjar o IP
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
# Erros nunca devolvem stack trace nem mensagens internas
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ─── JWT ───
# Obrigatório e sem valor padrão: a aplicação não sobe sem JWT_SECRET definido.
# Gere com: openssl rand -base64 48
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ───
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Criptografia de segredos no banco (Access Token do Mercado Pago) ───
# Obrigatório. Gere com: openssl rand -base64 32
app.security.encryption-key=${ENCRYPTION_KEY}

# ─── Pagamentos ───
# true só em desenvolvimento: libera o Pix de teste e a aprovação manual de pedidos
app.payments.allow-simulated=${ALLOW_SIMULATED_PAYMENTS:false}

# Mensalidades dos lojistas (Asaas). Sem a chave, a tela "Meu plano" avisa que a cobrança não está disponível.
# Sandbox: https://api-sandbox.asaas.com/v3  Produção: https://api.asaas.com/v3
app.asaas.api-url=${ASAAS_API_URL:https://api-sandbox.asaas.com/v3}
app.asaas.api-key=${ASAAS_API_KEY:}
app.asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}

# Endereço público do frontend, usado nos links enviados por e-mail
app.public-url=${PUBLIC_APP_URL:http://localhost:3000}

# E-mail (SMTP de qualquer provedor: Brevo, Resend, Gmail...). Sem MAIL_HOST, o link vai só para o log.
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:NexusCart <nao-responda@nexuscart.com.br>}

# ─── Limites de requisições por IP (RateLimitFilter) ───
app.ratelimit.global-per-minute=${RATE_LIMIT_GLOBAL_PER_MINUTE:300}
app.ratelimit.checkout-per-10min=${RATE_LIMIT_CHECKOUT_PER_10MIN:10}
app.ratelimit.login-per-10min=${RATE_LIMIT_LOGIN_PER_10MIN:30}
app.ratelimit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:10}
app.ratelimit.webhook-per-minute=${RATE_LIMIT_WEBHOOK_PER_MINUTE:120}
# Tamanho máximo do corpo das requisições (5 MB)
app.max-request-bytes=5242880
