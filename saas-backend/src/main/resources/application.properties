# ═══════════════════════════════════════════════
# NexusCart SaaS — Backend Configuration
# ═══════════════════════════════════════════════

# ─── Database ───
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/saas_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ─── Server ───
server.port=${SERVER_PORT:8081}

# ─── JWT ───
# Obrigatório e sem valor padrão: a aplicação não sobe sem JWT_SECRET definido.
# Gere com: openssl rand -base64 48
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ───
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}