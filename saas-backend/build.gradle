plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters existentes
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Módulos de Segurança e Autenticação
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JSON Web Token (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Outras dependências (PostgreSQL, Lombok, Validation)
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Migrations do banco
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Testes de integração contra um Postgres de verdade, criado no Docker para cada execução
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
}

// Valores APENAS para desenvolvimento local / testes.
// Não entram no .jar: em produção JWT_SECRET e ENCRYPTION_KEY são obrigatórios,
// e o Pix de teste fica desligado por padrão.
def devEnv = [
    JWT_SECRET              : 'diBp9kts7SJXLfMS5q4DaF0ang9EMVt4zvUHE32oGU1RF+tO9yLQM8XRW2xr0nop',
    ENCRYPTION_KEY          : '65EXDxlA45yq/t75UEV9k1K/J+jBqy7Pgytt35RBXXc=',
    ALLOW_SIMULATED_PAYMENTS: 'true',
]

def applyDevEnv = { task ->
    devEnv.each { name, value ->
        if (!System.getenv(name)) {
            task.environment name, value
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    applyDevEnv(it)
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('bootRun') {
    applyDevEnv(it)
}
