# ═══════════════════════════════════════════════
# NexusCart SaaS — Backend Configuration
# ═══════════════════════════════════════════════

# ─── Database ───
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/saas_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
# Log das queries só quando pedido (deixa o log de produção legível)
spring.jpa.show-sql=${SHOW_SQL:false}

# ─── Server ───
server.port=${SERVER_PORT:8081}

# ─── JWT ───
# Obrigatório e sem valor padrão: a aplicação não sobe sem JWT_SECRET definido.
# Gere com: openssl rand -base64 48
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ───
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Criptografia de segredos no banco (Access Token do Mercado Pago) ───
# Obrigatório. Gere com: openssl rand -base64 32
app.security.encryption-key=${ENCRYPTION_KEY}

# ─── Pagamentos ───
# true só em desenvolvimento: libera o Pix de teste e a aprovação manual de pedidos
app.payments.allow-simulated=${ALLOW_SIMULATED_PAYMENTS:false}
