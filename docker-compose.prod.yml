# Produção numa VPS: banco, backend e frontend.
# Uso: crie um arquivo .env na raiz (veja saas-backend/.env.example) e rode
#   docker compose -f docker-compose.prod.yml up -d --build
# Coloque um proxy com HTTPS na frente (Caddy, Nginx ou o painel da sua hospedagem).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./saas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saas_db}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (openssl rand -base64 48)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY (openssl rand -base64 32)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina o endereço público do frontend}
      ALLOW_SIMULATED_PAYMENTS: "false"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?defina o endereço público do frontend}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-NexusCart <nao-responda@nexuscart.com.br>}
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./saas-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina o endereço público do backend}
        NEXT_PUBLIC_LEGAL_OPERATOR: ${NEXT_PUBLIC_LEGAL_OPERATOR:?defina o responsável que aparece nos Termos}
        NEXT_PUBLIC_LEGAL_DOCUMENT: ${NEXT_PUBLIC_LEGAL_DOCUMENT:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:?defina o e-mail de contato}
        NEXT_PUBLIC_LEGAL_CITY: ${NEXT_PUBLIC_LEGAL_CITY:?defina a cidade/UF do foro}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
