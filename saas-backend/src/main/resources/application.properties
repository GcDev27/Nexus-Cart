# ═══════════════════════════════════════════════
# CentralCart SaaS — Backend Configuration
# ═══════════════════════════════════════════════

# ─── Database ───
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/saas_db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ─── Server ───
server.port=${SERVER_PORT:8081}

# ─── JWT ───
api.security.token.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
api.security.token.expiration=${JWT_EXPIRATION:86400000}

# ─── CORS ───
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}